name: issue-contract

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'agent-task')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure harness labels
        run: |
          gh label create agent-ready --repo "$GH_REPO" --color "0E8A16" --description "Contract-valid issue ready for an agent" --force
          gh label create agent-contract-invalid --repo "$GH_REPO" --color "B60205" --description "Issue contract is invalid" --force
          gh label create agent-in-progress --repo "$GH_REPO" --color "1D76DB" --description "Issue is claimed by an agent" --force
          gh label create agent-blocked --repo "$GH_REPO" --color "D93F0B" --description "Issue is blocked with an explicit reason" --force
          gh label create agent-completion-pending --repo "$GH_REPO" --color "FBCA04" --description "Completion evidence is pending close guard" --force
          gh label create agent-completion-invalid --repo "$GH_REPO" --color "B60205" --description "Completion evidence failed close guard" --force
      - name: Validate issue contract
        id: contract
        run: |
          set +e
          python3 tools/validate_agent_issue.py --issue "$ISSUE_NUMBER" --repo "$GH_REPO" --json > validation.json
          status=$?
          cat validation.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "completion_pending=$(jq -r '.completion_pending // false' validation.json)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Set contract-invalid state
        if: steps.contract.outputs.exit_code == '2'
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label agent-contract-invalid --remove-label agent-ready
          existing="$(gh api "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- agent-contract-feedback:v1 -->")) | .id' | head -n 1)"
          details="$(jq -r '.violations[]? | "- \(.code): \(.message)"' validation.json)"
          body="<!-- agent-contract-feedback:v1 -->
          agent-task/v1 が不適合です。

          $details"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -f body="$body"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$body"
          fi
      - name: Fail when contract validation was not possible
        if: steps.contract.outputs.exit_code == '3'
        run: |
          echo "issue contract の検証を実行できませんでした。GitHub取得または入力を確認してください。"
          exit 1
      - name: Set agent-ready state
        if: steps.contract.outputs.exit_code == '0' && steps.contract.outputs.completion_pending != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label agent-ready --remove-label agent-contract-invalid
      - name: Set completion-pending state
        if: steps.contract.outputs.exit_code == '0' && steps.contract.outputs.completion_pending == 'true'
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label agent-completion-pending --remove-label agent-ready --remove-label agent-contract-invalid
