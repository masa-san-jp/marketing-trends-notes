name: live-audit

# エージェント本体はローカルのハーネスで実行する。定期監査は不要なため、
# 課金対象になり得る schedule は使わず、必要時の手動確認だけ許可する。
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: 実時計の読み取り専用監査
        id: audit
        env:
          TZ: Asia/Tokyo
        run: |
          set +e
          run_date="$(date +%F)"
          audit_output="$(python3 tools/audit.py --dry-run --now "$run_date" --fail-on-findings 2>&1)"
          status=$?
          echo "$audit_output"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          title="鮮度更新: #77実装時の実時計監査 findings ($run_date)"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$title in:title" --json number --jq 'length')"
          if [ "$existing" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label enhancement --body "$audit_output"
          fi
          exit "$status"
